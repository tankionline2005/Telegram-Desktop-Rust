[package]
name = "tdr-lottie"
version = "0.1.0"
description = "Lottie animations (Telegram's .tgs stickers and emoji) rendered on the CPU, as tdesktop does with rlottie"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Already built for resvg/GPUI.
tiny-skia = "0.11"
serde_json = "1"
flate2 = "1.1"
# Already built for GPUI: properties of up to four numbers stay inline.
smallvec = "1"

[lints]
workspace = true
