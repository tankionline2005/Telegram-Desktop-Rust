[package]
name = "tdr-app"
version = "0.1.0"
description = "Unofficial Telegram Desktop Rust — the desktop application"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "unofficial-telegram-desktop-rust"
path = "src/main.rs"

[dependencies]
tdr-api.workspace = true
tdr-data.workspace = true
tdr-theme.workspace = true
gpui = "0.2.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
anyhow = "1.0.104"
tracing = "0.1.44"
unicode-segmentation = "1.13.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
smallvec = "1"
# Already built for GPUI: stroke joins and caps for drawn icons.
lyon = "1.0"
raw-window-handle = "0.6.2"
# Already built for GPUI; renders tdesktop's SVGs (tray icon, wallpaper pattern).
resvg = { version = "0.45.1", default-features = false }

[target."cfg(windows)".dependencies]
# Same version and a subset of the features GPUI enables: no extra build.
windows = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[target."cfg(windows)".build-dependencies]
embed-resource = "3.0.12"
