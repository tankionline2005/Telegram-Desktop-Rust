[workspace]
resolver = "3"
# Members are listed explicitly: glob patterns break when the checkout path
# contains `[` or `]` (e.g. "Telegram Desktop [Rust Version]").
members = [
    "crates/tl-parser",
    "crates/tl-gen",
    "crates/tl",
    "crates/crypto",
    "crates/mtproto",
    "crates/api",
    "crates/cli",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/tankionline2005/Telegram-Desktop-Rust"
rust-version = "1.90"

[workspace.dependencies]
tdr-tl-parser = { path = "crates/tl-parser" }
tdr-tl-gen = { path = "crates/tl-gen" }
tdr-tl = { path = "crates/tl" }
tdr-crypto = { path = "crates/crypto" }
tdr-mtproto = { path = "crates/mtproto" }
tdr-api = { path = "crates/api" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `release`: optimized builds for everyday work and measurements. No cross-crate LTO, so
# changing one file does not re-optimize the whole program (58 s -> a few seconds).
[profile.release]
debug = "line-tables-only"
incremental = true

# `dist`: what users get. Whole-program optimization; slow to build, built only for
# releases: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
panic = "abort"
debug = false
strip = "symbols"

# Fast local builds of the tooling.
[profile.dev.package."*"]
opt-level = 2
